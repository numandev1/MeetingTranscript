<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live transcript</title>
    <link rel="stylesheet" href="styles/app.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: var(--space-4) var(--space-4) var(--space-3);
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        /* The title is editable, so it needs to look editable on hover */
        #meeting-title {
            font-size: var(--text-md);
            font-weight: 600;
            border-radius: var(--radius-sm);
            padding: 0.15rem 0.3rem;
            margin: -0.15rem -0.3rem;
            transition: background-color var(--dur-fast) var(--ease);
            cursor: text;
        }

        #meeting-title:hover { background: var(--surface-hover); }

        #meeting-title:focus {
            outline: none;
            background: var(--bg);
            box-shadow: 0 0 0 2px var(--accent-line);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: var(--space-2);
            font-size: var(--text-xs);
            color: var(--ink-subtle);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        @media (prefers-reduced-motion: no-preference) {
            .live-dot { animation: pulse 2s var(--ease) infinite; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        #transcript-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4);
            scroll-behavior: smooth;
        }

        .transcript-block { margin-bottom: var(--space-4); }

        .block-header {
            display: flex;
            align-items: baseline;
            gap: var(--space-2);
            margin-bottom: 0.15rem;
        }

        .speaker-name {
            font-weight: 600;
            font-size: var(--text-sm);
            color: var(--accent);
        }

        .block-time {
            font-size: var(--text-xs);
            color: var(--ink-subtle);
            font-variant-numeric: tabular-nums;
        }

        .block-text {
            color: var(--ink-muted);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* The in-progress utterance, distinguished from settled text */
        #live-transcript-placeholder .block-text { color: var(--ink); }

        #transcript-container:empty::after {
            content: "Waiting for someone to speak. Captions must be on in the meeting.";
            display: block;
            padding: var(--space-6) var(--space-4);
            text-align: center;
            color: var(--ink-subtle);
            font-size: var(--text-sm);
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <header class="panel-header">
        <h1 id="meeting-title">Live transcript</h1>
        <div class="live-indicator">
            <span class="live-dot"></span>
            <span>Recording on this device</span>
        </div>
    </header>

    <div id="transcript-container"></div>
</body>

</html>
