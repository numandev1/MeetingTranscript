<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>MeetingTranscript</title>
  <link rel="stylesheet" href="styles/app.css">
  <style>
    body {
      width: 360px;
      padding: 0;
    }

    .popup-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-5) var(--space-5) var(--space-4);
    }

    .popup-header img {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .popup-header h1 {
      font-size: var(--text-md);
      line-height: 1.25;
    }

    .popup-header .sub-text {
      font-size: var(--text-xs);
    }

    .popup-header .btn {
      margin-left: auto;
      text-decoration: none;
    }

    .popup-section {
      padding: var(--space-4) var(--space-5);
      border-top: 1px solid var(--border);
    }

    .popup-section > .section-title {
      margin-bottom: var(--space-3);
    }

    /* Platform rows read as a switchable list, not a form */
    .platform-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) 0;
    }

    .platform-row { align-items: flex-start; }

    .platform-row label {
      margin-bottom: 0;
      font-weight: 450;
      color: var(--ink);
      cursor: pointer;
      flex: 1;
    }

    .beta-tag {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--ink-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 0.05rem 0.4rem;
    }

    .mode-option {
      display: flex;
      gap: var(--space-3);
      padding: var(--space-2) 0;
    }

    .mode-option label { margin-bottom: 0; cursor: pointer; }

    .mode-option strong {
      display: block;
      color: var(--ink);
      font-weight: 550;
    }

    .popup-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5);
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .footer-links {
      display: flex;
      gap: var(--space-4);
      font-size: var(--text-sm);
    }

    .footer-links a { text-decoration: none; color: var(--ink-subtle); }
    .footer-links a:hover { color: var(--accent); }

    #version {
      font-size: var(--text-xs);
      color: var(--ink-subtle);
      font-variant-numeric: tabular-nums;
    }

    .integrations {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .integrations img {
      width: 18px;
      height: 18px;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <header class="popup-header">
    <img src="./icon.png" alt="">
    <div>
      <h1>MeetingTranscript</h1>
      <p class="sub-text">Private meeting transcripts, on your device</p>
    </div>
    <!-- Up here so the most used action never needs a scroll -->
    <a class="btn btn-primary btn-sm" href="./meetings.html" target="_blank">Meetings</a>
  </header>

  <section class="popup-section">
    <p class="section-title">Platforms</p>

    <div class="platform-row">
      <input type="checkbox" id="enable-google-meet">
      <label for="enable-google-meet">Google Meet</label>
    </div>
    <div class="platform-row">
      <input type="checkbox" id="enable-teams">
      <label for="enable-teams">Microsoft Teams
        <span class="sub-text">Transcript only &mdash; no chat capture</span>
      </label>
      <span class="beta-tag">Beta</span>
    </div>
    <div class="platform-row">
      <input type="checkbox" id="enable-zoom">
      <label for="enable-zoom">Zoom
        <span class="sub-text">Transcript only &mdash; no chat capture</span>
      </label>
      <span class="beta-tag">Beta</span>
    </div>
  </section>

  <section class="popup-section">
    <p class="section-title">Recording</p>

    <div class="mode-option">
      <input type="radio" name="mode" id="auto-mode">
      <label for="auto-mode">
        <strong>Automatic</strong>
        <span class="sub-text">Every meeting is transcribed</span>
      </label>
    </div>
    <div class="mode-option">
      <input type="radio" name="mode" id="manual-mode">
      <label for="manual-mode">
        <strong>Manual</strong>
        <span class="sub-text">Turn captions on yourself to start</span>
      </label>
    </div>
  </section>

  <section class="popup-section">
    <div class="checkbox-group">
      <input type="checkbox" id="hide-captions">
      <label for="hide-captions">
        Hide captions in the meeting
        <span class="sub-text">Keeps recording, hides the caption overlay</span>
      </label>
    </div>
  </section>

  <section class="popup-section">
    <div class="integrations">
      <img src="./icons/google-docs.svg" alt="">
      <img src="./icons/notion.svg" alt="">
      <p class="sub-text">Send transcripts anywhere with <a href="./meetings.html#webhooks"
          target="_blank">webhooks</a>.</p>
    </div>
  </section>

  <footer class="popup-footer">
    <nav class="footer-links">
      <a href="./meetings.html" target="_blank">Meetings</a>
      <a href="./meetings.html#webhooks" target="_blank">Settings</a>
      <a href="https://github.com/numandev/transcriptonic/issues" target="_blank">Report a bug</a>
    </nav>
    <span id="version"></span>
  </footer>
</body>

</html>
