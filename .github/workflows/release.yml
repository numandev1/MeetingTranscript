name: Build and release

# Releasing is automatic: every push to main that changes what ships in the
# extension bumps the patch version, commits that bump, tags, publishes a GitHub
# release and submits it to the Chrome Web Store. See
# docs/chrome-web-store-publishing.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Cut a new version now, even if nothing in the extension changed"
        type: boolean
        default: false
      submit_to_store:
        description: "Resubmit the current version to the Chrome Web Store (e.g. after a review cleared)"
        type: boolean
        default: false

# Needed to push the version bump, create releases and upload assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Pull request builds are disposable. A release run is not: cancelling it between
  # the bump commit and the store upload would leave a version half shipped.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history and tags: the next version is derived from the last v* tag
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # A build that does not type check must never reach a release
        run: npm run check

      - name: Test
        run: npm test

      # --- Version: bump the patch when something that ships changed ---------
      - name: Prepare release
        id: prep
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release))
        run: |
          set -euo pipefail
          node scripts/prepare-release.mjs ${{ inputs.release && '--force' || '' }}

      - name: Commit version bump
        id: bump
        if: steps.prep.outputs.release == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.prep.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/manifest.json CHANGELOG.md
          # The version may already be committed when a run that bumped it was
          # interrupted; the release then goes out from HEAD as it is.
          if ! git diff --cached --quiet; then
            # GITHUB_TOKEN pushes never trigger workflows; [skip ci] says so for readers
            git commit -m "chore(release): v$VERSION [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build production zip
        run: npm run zip

      - name: Resolve build output
        id: build
        run: |
          set -euo pipefail
          ZIP=$(ls zip/*.zip | head -1)
          VERSION=$(node -p "require('./package.json').version")
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Verify the zip is loadable
        # Catches an empty or mis-structured archive here rather than when someone
        # downloads it and Chrome refuses to load the extension.
        run: |
          set -euo pipefail
          ZIP="${{ steps.build.outputs.zip }}"
          unzip -l "$ZIP"
          for required in manifest.json background.js popup.html styles/app.css; do
            unzip -l "$ZIP" | grep -q " $required$" || { echo "::error::$required missing from $ZIP"; exit 1; }
          done
          VERSION_IN_ZIP=$(unzip -p "$ZIP" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          [ "$VERSION_IN_ZIP" = "${{ steps.build.outputs.version }}" ] \
            || { echo "::error::manifest says $VERSION_IN_ZIP, package.json says ${{ steps.build.outputs.version }}"; exit 1; }
          echo "zip verified: $ZIP (v$VERSION_IN_ZIP)"

      # Always available, including on pull requests where no release is cut
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetingtranscripttoobsidian-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      # --- Versioned release ------------------------------------------------
      - name: Publish versioned release
        id: release
        if: steps.prep.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to publish"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" "${{ steps.build.outputs.zip }}" \
            --target "${{ steps.bump.outputs.sha }}" \
            --title "$TAG" \
            --notes-file release-notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

      # --- Chrome Web Store: upload and submit for review -------------------
      # Every newly cut version is submitted; "Run workflow" with submit_to_store
      # resubmits the current one. Credentials are created once with `npm run
      # cws:auth`; until then the script warns and exits 2, which does not fail the
      # release that has already been published above.
      - name: Submit to Chrome Web Store
        if: steps.release.outputs.created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.submit_to_store)
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          status=0
          node scripts/cws-publish.mjs "${{ steps.build.outputs.zip }}" || status=$?
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || exit "$status"

      # --- Rolling build from main: always one fresh, downloadable zip ------
      - name: Publish rolling build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.build.outputs.zip }}"
          VERSION="${{ steps.build.outputs.version }}"
          TARGET="${{ steps.bump.outputs.sha || github.sha }}"

          # A second copy under a fixed name, so the download link stays valid
          # when the version is bumped.
          cp "$ZIP" "zip/meetingtranscripttoobsidian-latest.zip"

          # Built line by line so every line of the workflow stays indented inside
          # this block while the notes file itself has no leading whitespace.
          printf '%s\n' \
            "Automatic build of \`main\` at \`${TARGET:0:7}\`." \
            "" \
            "**Install**" \
            "" \
            "1. Download \`meetingtranscripttoobsidian-latest.zip\` below and unzip it." \
            "2. Open \`chrome://extensions\` and turn on **Developer mode**." \
            "3. Choose **Load unpacked** and select the unzipped folder." \
            "" \
            "This build is replaced on every push to \`main\`. For a fixed version, use a tagged release." \
            > /tmp/release-notes.md

          # Recreated rather than edited, so the tag always points at this commit
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            "$ZIP" "zip/meetingtranscripttoobsidian-latest.zip" \
            --prerelease \
            --target "${{ steps.bump.outputs.sha || github.sha }}" \
            --title "Latest build (v${VERSION})" \
            --notes-file /tmp/release-notes.md
