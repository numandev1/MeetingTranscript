name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed to create releases and upload assets. Nothing else is granted.
permissions:
  contents: write

concurrency:
  # A newer push makes an in-flight build obsolete, so drop it rather than racing
  # two jobs to publish to the same rolling release.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        # A build that does not type check must never reach a release
        run: npm run check

      - name: Test
        run: npm test

      - name: Build production zip
        run: npm run zip

      - name: Resolve build output
        id: build
        run: |
          set -euo pipefail
          ZIP=$(ls zip/*.zip | head -1)
          VERSION=$(node -p "require('./package.json').version")
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Verify the zip is loadable
        # Catches an empty or mis-structured archive here rather than when someone
        # downloads it and Chrome refuses to load the extension.
        run: |
          set -euo pipefail
          ZIP="${{ steps.build.outputs.zip }}"
          unzip -l "$ZIP"
          for required in manifest.json background.js popup.html styles/app.css; do
            unzip -l "$ZIP" | grep -q " $required$" || { echo "::error::$required missing from $ZIP"; exit 1; }
          done
          VERSION_IN_ZIP=$(unzip -p "$ZIP" manifest.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          [ "$VERSION_IN_ZIP" = "${{ steps.build.outputs.version }}" ] \
            || { echo "::error::manifest says $VERSION_IN_ZIP, package.json says ${{ steps.build.outputs.version }}"; exit 1; }
          echo "zip verified: $ZIP (v$VERSION_IN_ZIP)"

      # Always available, including on pull requests where no release is cut
      - name: Extract release notes from CHANGELOG.md
        # Every version must say what changed before it can ship, so a bump without a
        # changelog section fails here, on the pull request, rather than at release.
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          awk -v v="## $VERSION" '$0==v{found=1;next} found&&/^## /{exit} found{print}' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::No '## $VERSION' section in CHANGELOG.md. Add one describing this version."
            exit 1
          fi
          cat release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetingtranscripttoobsidian-${{ steps.build.outputs.version }}
          path: ${{ steps.build.outputs.zip }}
          if-no-files-found: error
          retention-days: 30

      # --- Versioned release: cut automatically when the version changes ----
      # Bumping the version in package.json and src/manifest.json and merging to main
      # is the whole release. A version that already has a release is left alone, so
      # ordinary pushes only refresh the rolling build below. Pushing a v* tag by hand
      # still works and goes through the same step.
      - name: Publish versioned release
        id: release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.build.outputs.version }}"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to publish"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" "${{ steps.build.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md
          echo "created=true" >> "$GITHUB_OUTPUT"

      # --- Chrome Web Store: upload and submit for review -------------------
      # Runs only for a newly cut version, and only once the store credentials exist
      # as repository secrets (CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN)
      # and the item id as the variable CWS_EXTENSION_ID. Without them it is skipped.
      - name: Publish to Chrome Web Store
        if: steps.release.outputs.created == 'true' && vars.CWS_EXTENSION_ID != ''
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || [ -z "$CWS_REFRESH_TOKEN" ]; then
            echo "::warning::CWS_EXTENSION_ID is set but the CWS_* secrets are not; skipping the store upload"
            exit 0
          fi
          ACCESS_TOKEN=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token \
            | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).access_token")
          echo "::add-mask::$ACCESS_TOKEN"

          UPLOAD=$(curl -sS -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H "x-goog-api-version: 2" \
            -T "${{ steps.build.outputs.zip }}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")
          echo "$UPLOAD"
          echo "$UPLOAD" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8')); if (r.uploadState !== 'SUCCESS') { console.error('::error::Store upload failed: ' + JSON.stringify(r.itemError || r)); process.exit(1) }"

          PUBLISH=$(curl -sS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish")
          echo "$PUBLISH"
          echo "$PUBLISH" | node -e "const r=JSON.parse(require('fs').readFileSync(0,'utf8')); const s=r.status||[]; if (!s.includes('OK') && !s.includes('ITEM_PENDING_REVIEW')) { console.error('::error::Store publish failed: ' + JSON.stringify(r)); process.exit(1) }"

      # --- Rolling build from main: always one fresh, downloadable zip ------
      - name: Publish rolling build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="${{ steps.build.outputs.zip }}"
          VERSION="${{ steps.build.outputs.version }}"

          # A second copy under a fixed name, so the download link stays valid
          # when the version is bumped.
          cp "$ZIP" "zip/meetingtranscripttoobsidian-latest.zip"

          # Built line by line so every line of the workflow stays indented inside
          # this block while the notes file itself has no leading whitespace.
          printf '%s\n' \
            "Automatic build of \`main\` at \`${GITHUB_SHA:0:7}\`." \
            "" \
            "**Install**" \
            "" \
            "1. Download \`meetingtranscripttoobsidian-latest.zip\` below and unzip it." \
            "2. Open \`chrome://extensions\` and turn on **Developer mode**." \
            "3. Choose **Load unpacked** and select the unzipped folder." \
            "" \
            "This build is replaced on every push to \`main\`. For a fixed version, use a tagged release." \
            > /tmp/release-notes.md

          # Recreated rather than edited, so the tag always points at this commit
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            "$ZIP" "zip/meetingtranscripttoobsidian-latest.zip" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Latest build (v${VERSION})" \
            --notes-file /tmp/release-notes.md
